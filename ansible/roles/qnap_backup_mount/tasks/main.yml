---
- name: Require explicit QNAP export and fixed mountpoint
  ansible.builtin.assert:
    that:
      - "'REPLACE' not in qnap_backup_server"
      - "'REPLACE' not in qnap_backup_export"
      - qnap_backup_export.startswith('/')
      - qnap_backup_mountpoint == '/mnt/qnap-backups'
- name: Create backup mountpoint
  ansible.builtin.file:
    path: "{{ qnap_backup_mountpoint }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
- name: Configure dedicated backup export in fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^\S+\s+/mnt/qnap-backups\s+'
    line: "{{ qnap_backup_server }}:{{ qnap_backup_export }} /mnt/qnap-backups nfs4 rw,_netdev,nosuid,nodev,noexec,x-systemd.automount,x-systemd.mount-timeout=15s 0 0"
    backup: true
  notify: reload systemd

---
- name: Require Ubuntu 24.04
  ansible.builtin.assert:
    that:
      - ansible_distribution == 'Ubuntu'
      - ansible_distribution_version == '24.04'
- name: Install baseline packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - git
      - jq
      - nfs-common
      - qemu-guest-agent
      - python3
      - python3-venv
      - rsync
      - unattended-upgrades
    state: present
    update_cache: true
- name: Enable guest agent
  ansible.builtin.service:
    name: qemu-guest-agent
    enabled: true
    state: started
- name: Create coding group
  ansible.builtin.group:
    name: "{{ coding_user }}"
    state: present
- name: Create unprivileged coding account
  ansible.builtin.user:
    name: "{{ coding_user }}"
    group: "{{ coding_user }}"
    shell: /bin/bash
    create_home: true
    password_lock: true
    groups: ''
    append: false
- name: Disable password SSH login
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-homelab.conf
    mode: '0644'
    validate: /usr/sbin/sshd -t -f %s
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
      AllowUsers {{ development_user }}
  notify: reload ssh
- name: Create local CLI tool directory
  ansible.builtin.file:
    path: "/home/{{ coding_user }}/.local/ai-tools"
    state: directory
    owner: "{{ coding_user }}"
    group: "{{ coding_user }}"
    mode: '0750'
- name: Copy reviewed CLI installer to coding account
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../scripts/install-ai-cli.sh"
    dest: "/home/{{ coding_user }}/.local/ai-tools/install-ai-cli.sh"
    owner: "{{ coding_user }}"
    group: "{{ coding_user }}"
    mode: '0750'

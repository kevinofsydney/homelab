---
- name: Require Ubuntu 24.04
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Ubuntu'
      - ansible_facts['distribution_version'] == '24.04'
- name: Install baseline packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - git
      - jq
      - nfs-common
      - qemu-guest-agent
      - python3
      - python3-venv
      - rsync
      - unattended-upgrades
    state: present
    update_cache: true
- name: Inspect installed services for first-run check mode
  ansible.builtin.service_facts:
- name: Enable guest agent
  ansible.builtin.service:
    name: qemu-guest-agent
    enabled: true
    state: started
  when: not ansible_check_mode or 'qemu-guest-agent.service' in ansible_facts.services
- name: Create coding group
  ansible.builtin.group:
    name: "{{ coding_user }}"
    state: present
- name: Create unprivileged coding account
  ansible.builtin.user:
    name: "{{ coding_user }}"
    group: "{{ coding_user }}"
    shell: /bin/bash
    create_home: true
    password_lock: true
    groups: ''
    append: false
  register: coding_account
- name: Disable password SSH login
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-homelab.conf
    mode: '0644'
    validate: /usr/sbin/sshd -t -f %s
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
      AllowUsers {{ development_user }}
  notify: reload ssh
- name: Create local CLI tool directory
  ansible.builtin.file:
    path: "/home/{{ coding_user }}/.local/ai-tools"
    state: directory
    owner: "{{ coding_user }}"
    group: "{{ coding_user }}"
    mode: '0750'
  when: not ansible_check_mode or not coding_account.changed
- name: Copy reviewed CLI installer to coding account
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../scripts/install-ai-cli.sh"
    dest: "/home/{{ coding_user }}/.local/ai-tools/install-ai-cli.sh"
    owner: "{{ coding_user }}"
    group: "{{ coding_user }}"
    mode: '0750'
  when: not ansible_check_mode or not coding_account.changed
- name: Add user-local coding tools to login PATH
  ansible.builtin.blockinfile:
    path: "/home/{{ coding_user }}/.profile"
    create: true
    owner: "{{ coding_user }}"
    group: "{{ coding_user }}"
    mode: '0644'
    marker: '# {mark} HOMELAB AI TOOLS'
    block: |
      export PATH="$HOME/.local/ai-tools/node/bin:$HOME/.local/ai-tools/npm/node_modules/.bin:$PATH"
  when: not ansible_check_mode or not coding_account.changed

all:
  children:
    development:
      hosts:
        dev:
          ansible_host: REPLACE_VM_IP_OR_TAILSCALE_NAME
          ansible_user: devops
          # Fill approved public keys in ignored hosts.yml; never copy private keys.
          operator_ssh_public_keys: []
          ansible_ssh_private_key_file: REPLACE_ABSOLUTE_PRIVATE_KEY_PATH
          qnap_backup_server: REPLACE_NAS_HOST
          qnap_backup_export: REPLACE_NFS_EXPORT
    applications:
      hosts:
        home_services:
          ansible_host: REPLACE_APPLICATION_VM_IP
          ansible_user: devops
          ansible_ssh_private_key_file: REPLACE_ABSOLUTE_PRIVATE_KEY_PATH
          operator_ssh_public_keys: []
    immich:
      hosts:
        immich_vm:
          ansible_host: REPLACE_IMMICH_VM_IP
          ansible_user: devops
          ansible_ssh_private_key_file: REPLACE_ABSOLUTE_PRIVATE_KEY_PATH
          immich_status_bind_ip: REPLACE_IMMICH_TAILSCALE_IP
    hermes_agents:
      hosts:
        hermes_agent:
          ansible_host: REPLACE_HERMES_VM_IP
          ansible_user: devops
          ansible_ssh_private_key_file: REPLACE_ABSOLUTE_PRIVATE_KEY_PATH
          # Leave undefined until the tailnet policy in docs/immich-monitoring.md is in place.
          # hermes_immich_status_ip: REPLACE_IMMICH_TAILSCALE_IP

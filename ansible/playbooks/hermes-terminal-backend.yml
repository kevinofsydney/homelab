---
- name: Configure the dormant Hermes installation for its planned sandbox
  hosts: hermes_agents
  become: true
  gather_facts: true
  tasks:
    - name: Require the reviewed guest
      ansible.builtin.assert:
        that:
          - ansible_facts['hostname'] == 'hermes-agent'
          - ansible_facts['distribution'] == 'Ubuntu'
          - ansible_facts['distribution_version'] == '24.04'

    - name: Inspect current backend without displaying configuration or credentials
      ansible.builtin.command:
        argv:
          - /usr/sbin/runuser
          - -u
          - hermes
          - --
          - python3
          - -c
          - >-
            import pathlib,yaml; c=yaml.safe_load((pathlib.Path.home()/'.hermes/config.yaml').read_text()) or {}; print((c.get('terminal') or {}).get('backend',''))
      register: hermes_terminal_backend
      changed_when: false
      check_mode: false

    - name: Select Docker terminal backend using Hermes configuration CLI
      ansible.builtin.command:
        argv: [/usr/sbin/runuser, -u, hermes, --, /home/hermes/.local/bin/hermes, config, set, terminal.backend, docker]
      environment:
        HOME: /home/hermes
      when: hermes_terminal_backend.stdout != 'docker' and not ansible_check_mode

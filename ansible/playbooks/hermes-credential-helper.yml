---
- name: Install interactive Hermes credential helper without configuring secrets
  hosts: hermes_agents
  become: true
  gather_facts: false
  tasks:
    - name: Install reviewed credential helper
      ansible.builtin.copy:
        src: ../../scripts/hermes/set-credentials.py
        dest: /usr/local/bin/hermes-secret
        owner: root
        group: root
        mode: '0755'
